# ============================================================
#  GENERADO AUTOMATICAMENTE POR FLOW EDITOR - NO EDITAR A MANO
#  Flujo: default
# ============================================================

route[FLOW] {
	xdbg("flow[default]: $rm $fU -> $rU desde $si\n");
	route(FLOW_N_start);
	route(FLOW_NO_MATCH);
}

# Ningun nodo terminal alcanzado: rechazar
route[FLOW_NO_MATCH] {
	send_reply("404", "Not Found");
	exit;
}

# [inicio] Inicio
route[FLOW_N_start] {
	route(FLOW_N_c_premium);
}

# [condicion/prefijo] Numeros premium 905
route[FLOW_N_c_premium] {
	if ($rU =~ "^905") {
		route(FLOW_N_r_block);
	} else {
		route(FLOW_N_c_intl);
	}
}

# [rechazar] Bloquear premium
route[FLOW_N_r_block] {
	send_reply("403", "Destino bloqueado");
	exit;
}

# [condicion/prefijo] Internacional 00
route[FLOW_N_c_intl] {
	if ($rU =~ "^00") {
		route(FLOW_N_a_strip);
	} else {
		route(FLOW_N_d_local);
	}
}

# [accion/strip] Quitar 00
route[FLOW_N_a_strip] {
	strip(2);
	route(FLOW_N_d_carriers);
}

# [balanceador] Carriers internacionales
route[FLOW_N_d_carriers] {
	if (!ds_select_dst("1", "4")) {
		send_reply("503", "Service Unavailable");
		exit;
	}
	t_on_failure("FLOW_DISPATCH_FAILOVER");
	route(RELAY);
	exit;
}

# [balanceador] PBX local
route[FLOW_N_d_local] {
	if (!ds_select_dst("2", "4")) {
		send_reply("503", "Service Unavailable");
		exit;
	}
	t_on_failure("FLOW_DISPATCH_FAILOVER");
	route(RELAY);
	exit;
}
