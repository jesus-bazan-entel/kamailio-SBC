# =====================================================================
#  kamailio-local.cfg - personalizacion por entorno
# =====================================================================
#  Este archivo se importa al inicio de kamailio.cfg. Aqui puedes:
#
#  - Agregar sockets de escucha adicionales:
#      listen=udp:0.0.0.0:5070
#
#  - Anunciar la IP publica si el SBC esta detras de NAT 1:1:
#      listen=udp:0.0.0.0:5060 advertise 203.0.113.10:5060
#
#  - Activar caracteristicas opcionales antes de los #!define
#    del archivo principal (descomentar alla):
#      WITH_RTPENGINE  -> proxy de media con rtpengine
#      WITH_DEBUG      -> logs detallados
#
#  Por defecto no define nada.
# =====================================================================
