#!KAMAILIO
#
# =====================================================================
#  Kamailio SBC optimizado para enrutamiento de trafico SIP
# =====================================================================
#
#  - Anti-flood (pike + htable con baneo automatico de IPs)
#  - Deteccion y manejo de NAT (nathelper, rtpengine opcional)
#  - Balanceo de carga con failover (dispatcher)
#  - Tracking de dialogos (llamadas activas visibles via RPC)
#  - RPC JSON sobre HTTP (puerto 5080) para el Flow Editor
#  - La logica de enrutamiento de negocio se genera VISUALMENTE
#    con el Flow Editor y se incluye desde flow/flow-routing.cfg
#
#  Memoria: se recomienda arrancar con  kamailio -m 256 -M 16
#  (el entrypoint del contenedor ya lo hace, ver run.sh)
#
# ---------------------------------------------------------------------

# Personalizacion local opcional (listen extra, defines, etc.)
import_file "kamailio-local.cfg"

####### Flags de caracteristicas #########

#!define WITH_ANTIFLOOD
#!define WITH_NAT
##!define WITH_RTPENGINE
##!define WITH_DEBUG

####### Parametros globales #########

#!ifdef WITH_DEBUG
debug=3
#!else
debug=2
#!endif

log_stderror=yes
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

fork=yes
children=8

# No revelar informacion del software
server_signature=no
sip_warning=no
server_header="Server: SBC"
user_agent_header="User-Agent: SBC"

auto_aliases=no

# DNS: cache interna y failover por SRV
dns_try_ipv6=no
use_dns_cache=on
use_dns_failover=on
dns_srv_lb=yes

# Limites de descriptores (muchas conexiones TCP/TLS)
open_files_limit=16384

# Optimizacion TCP
disable_tcp=no
tcp_accept_no_cl=yes
tcp_async=yes
tcp_connect_timeout=5
tcp_connection_lifetime=3605
tcp_max_connections=8192
tcp_keepalive=yes
tcp_keepidle=60

# Sockets de escucha
#  - 5060 udp/tcp : trafico SIP
#  - 5080 tcp     : RPC JSON sobre HTTP (solo para el Flow Editor,
#                   NO exponer a internet)
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tcp:0.0.0.0:5080

# Si el SBC esta detras de NAT con IP publica fija, usar en
# kamailio-local.cfg algo como:
#   listen=udp:0.0.0.0:5060 advertise 203.0.113.10:5060

####### Modulos #########

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "xlog.so"
loadmodule "xhttp.so"
loadmodule "dispatcher.so"
loadmodule "dialog.so"

#!ifdef WITH_ANTIFLOOD
loadmodule "htable.so"
loadmodule "pike.so"
#!endif

#!ifdef WITH_NAT
loadmodule "nathelper.so"
#!endif

#!ifdef WITH_RTPENGINE
loadmodule "rtpengine.so"
#!endif

####### Parametros de modulos #########

# ----- jsonrpcs (RPC para kamcmd y para el Flow Editor via HTTP) -----
modparam("jsonrpcs", "pretty_format", 1)
modparam("jsonrpcs", "fifo_name", "/run/kamailio/kamailio_rpc.fifo")
modparam("jsonrpcs", "dgram_socket", "/run/kamailio/kamailio_rpc.sock")
# fifo + datagram + http
modparam("jsonrpcs", "transport", 7)

# ----- ctl -----
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")

# ----- tm (timers agresivos para failover rapido) -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 4000)
modparam("tm", "fr_inv_timer", 60000)
modparam("tm", "reparse_on_dns_failover", 1)

# ----- rr -----
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 1)

# ----- dispatcher (grupos de destinos definidos en dispatcher.list) -----
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "xavp_dst", "_dsdst_")
modparam("dispatcher", "xavp_ctx", "_dsctx_")
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_ping_reply_codes", "class=2")
# 1 = sondear solo destinos en estado probing/inactive
modparam("dispatcher", "ds_probing_mode", 1)

# ----- dialog (tracking de llamadas activas, visibles en el editor) -----
modparam("dialog", "default_timeout", 43200)
modparam("dialog", "dlg_match_mode", 1)
modparam("dialog", "detect_spirals", 1)

#!ifdef WITH_ANTIFLOOD
# ----- pike + htable: anti-flood con baneo temporal -----
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 4)
modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")
#!endif

#!ifdef WITH_NAT
# ----- nathelper -----
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", 7)
modparam("nathelper", "sipping_from", "sip:pinger@kamailio.sbc")
#!endif

#!ifdef WITH_RTPENGINE
# ----- rtpengine (proxy de media) -----
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
#!endif

####### Logica de enrutamiento #########

# Flags de mensaje / branch
#!define FLT_NATS 5
#!define FLB_NATB 6
#!define FLB_NATSIPPING 7

request_route {

	# Chequeos iniciales: anti-flood, sanidad, scanners
	route(REQINIT);

	# Deteccion de NAT
	route(NATDETECT);

	# CANCEL: relacionarlo con la transaccion INVITE
	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	# Peticiones dentro de dialogo (re-INVITE, BYE, ACK, ...)
	route(WITHINDLG);

	# Solo peticiones iniciales a partir de aqui
	# (absorber retransmisiones sin re-ejecutar la logica)
	t_check_trans();

	# Las peticiones iniciales no deben traer Route propio
	remove_hf("Route");

	# Responder OPTIONS dirigidos al propio SBC (keepalives)
	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "Keepalive");
		exit;
	}

	if (!is_method("INVITE|MESSAGE")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}

	if (is_method("INVITE")) {
		# Tracking de la llamada (visible en el Flow Editor)
		dlg_manage();
		record_route();
	}

	# ============================================================
	#  FLUJO VISUAL: logica generada por el Flow Editor
	#  (archivo flow/flow-routing.cfg, ruta FLOW)
	# ============================================================
	route(FLOW);
	exit;
}

# Chequeos iniciales de toda peticion
route[REQINIT] {

#!ifdef WITH_ANTIFLOOD
	# No aplicar anti-flood a nuestros propios destinos conocidos
	if (!ds_is_from_list()) {
		if ($sht(ipban=>$si) != $null) {
			# IP baneada temporalmente: descartar en silencio
			xdbg("peticion descartada de IP baneada: $rm de $si:$sp\n");
			exit;
		}
		if (!pike_check_req()) {
			xlog("L_ALERT", "ALERTA: pike bloqueando $rm de $si:$sp - baneo 5 min\n");
			$sht(ipban=>$si) = 1;
			exit;
		}
	}
#!endif

	# Cortar scanners conocidos
	if ($ua =~ "friendly|scanner|sipcli|sipvicious|VaxSIPUserAgent") {
		sl_send_reply("200", "OK");
		exit;
	}

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "mensaje malformado de $si:$sp\n");
		exit;
	}
}

# Peticiones dentro de dialogo
route[WITHINDLG] {
	if (!has_totag()) {
		return;
	}

	if (loose_route()) {
		route(DLGURI);
		route(RELAY);
		exit;
	}

	if (is_method("ACK")) {
		if (t_check_trans()) {
			# ACK de respuesta negativa: lo absorbe tm
			route(RELAY);
			exit;
		}
		# ACK sin transaccion: descartar
		exit;
	}

	sl_send_reply("404", "Not Here");
	exit;
}

# Relay con manejo de branches/replies/failure
route[RELAY] {
	if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
		if (!t_is_set("branch_route")) {
			t_on_branch("MANAGE_BRANCH");
		}
		if (!t_is_set("onreply_route")) {
			t_on_reply("MANAGE_REPLY");
		}
	}
	if (is_method("INVITE")) {
		if (!t_is_set("failure_route")) {
			t_on_failure("MANAGE_FAILURE");
		}
	}
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# Deteccion de NAT
route[NATDETECT] {
#!ifdef WITH_NAT
	force_rport();
	if (nat_uac_test("19")) {
		if (is_first_hop()) {
			set_contact_alias();
		}
		setflag(FLT_NATS);
	}
#!endif
	return;
}

# Ajustes de URI en peticiones in-dialog que vienen de detras de NAT
route[DLGURI] {
#!ifdef WITH_NAT
	if (!isdsturiset()) {
		handle_ruri_alias();
	}
#!endif
	return;
}

# Manejo de NAT/media por branch y en replies
route[NATMANAGE] {
#!ifdef WITH_NAT
	if (is_request()) {
		if (has_totag()) {
			if (check_route_param("nat=yes")) {
				setbflag(FLB_NATB);
			}
		}
	}
	if (!(isflagset(FLT_NATS) || isbflagset(FLB_NATB))) {
		return;
	}

#!ifdef WITH_RTPENGINE
	if (is_request()) {
		if (!has_totag()) {
			if (t_is_branch_route()) {
				rtpengine_manage("replace-origin replace-session-connection");
			}
		}
	}
	if (is_reply()) {
		if (has_body("application/sdp")) {
			rtpengine_manage("replace-origin replace-session-connection");
		}
	}
#!endif

	if (is_request()) {
		if (!has_totag()) {
			if (t_is_branch_route()) {
				add_rr_param(";nat=yes");
			}
		}
	}
	if (is_reply()) {
		if (isbflagset(FLB_NATB)) {
			if (is_first_hop()) {
				set_contact_alias();
			}
		}
	}
#!endif
	return;
}

branch_route[MANAGE_BRANCH] {
	xdbg("nuevo branch [$T_branch_idx] a $ru\n");
	route(NATMANAGE);
}

onreply_route[MANAGE_REPLY] {
	xdbg("reply entrante: $rs $rr\n");
	if (status =~ "[12][0-9][0-9]") {
		route(NATMANAGE);
	}
}

failure_route[MANAGE_FAILURE] {
	route(NATMANAGE);
	if (t_is_canceled()) {
		exit;
	}
}

# ============================================================
#  Failover de dispatcher: usado por los nodos "Balanceador"
#  del Flow Editor. Ante timeout o 5xx prueba el siguiente
#  destino del grupo y marca el fallido como inactivo.
# ============================================================
failure_route[FLOW_DISPATCH_FAILOVER] {
	route(NATMANAGE);
	if (t_is_canceled()) {
		exit;
	}
	if (t_check_status("408|5[0-9][0-9]")) {
		ds_mark_dst("ip");
		if (ds_next_dst()) {
			xlog("L_WARN", "failover dispatcher: probando siguiente destino $du para $ci\n");
			t_on_failure("FLOW_DISPATCH_FAILOVER");
			route(RELAY);
			exit;
		}
		xlog("L_ERR", "failover dispatcher: sin destinos disponibles para $ci\n");
		t_reply("503", "Service Unavailable");
		exit;
	}
}

# ============================================================
#  RPC JSON sobre HTTP para el Flow Editor (puerto 5080)
#  Solo se acepta desde redes privadas.
# ============================================================
event_route[xhttp:request] {
	if (!(src_ip == 127.0.0.0/8 || src_ip == 10.0.0.0/8
			|| src_ip == 172.16.0.0/12 || src_ip == 192.168.0.0/16)) {
		xhttp_reply("403", "Forbidden", "text/html", "");
		exit;
	}
	if ($hu =~ "^/RPC") {
		jsonrpc_dispatch();
		exit;
	}
	xhttp_reply("404", "Not Found", "text/html", "");
	exit;
}

# ============================================================
#  Logica de enrutamiento generada por el Flow Editor.
#  NO editar a mano: usar la interfaz web (puerto 8088).
# ============================================================
include_file "/etc/kamailio/flow/flow-routing.cfg"
